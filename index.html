<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0e">
  <title>Cobalt · Boshqaruv</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{color-scheme:dark;--bg:#0a0c0e;--card:#15191c;--line:#2a3033;--muted:#879093;--white:#f1f3ef;--lime:#d7fb79;--blue:#8acbff;--red:#ff8277}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 24%,#1a211b 0,#101311 36%,var(--bg) 72%);color:var(--white);font-family:Manrope,system-ui,sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
    .app{width:min(100%,430px);min-height:100svh;display:flex;flex-direction:column;padding:16px 0 13px}
    .top{display:flex;justify-content:space-between;align-items:center;min-height:22px}
    .brand{font-size:11px;font-weight:800;letter-spacing:.2em;color:#e1e6df}.brand span{color:var(--lime)}
    .connection{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #ffffff12;border-radius:30px;background:#ffffff06;font:9px 'DM Mono',monospace;letter-spacing:.08em;color:#aeb7b0}
    .dot{width:6px;height:6px;border-radius:50%;background:#a8ad9c;box-shadow:0 0 0 4px #b5bf8b12}
    .heading{margin-top:12px;display:flex;align-items:flex-end;justify-content:space-between}.eyebrow{font:9px 'DM Mono',monospace;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}.heading h1{margin:3px 0 0;font-size:30px;line-height:1;letter-spacing:-.06em;font-weight:800}.vehicle{color:#879093;font-size:10px;margin-bottom:1px}
    .scene{position:relative;height:clamp(132px,25svh,172px);margin:12px -2px 0;overflow:hidden;border:1px solid #ffffff17;border-radius:18px;background:#1a1d1b;box-shadow:0 16px 32px #0005}.scene:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(0deg,#090c0eb8,transparent);pointer-events:none}.scene img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 56%;filter:brightness(.78) saturate(.76) contrast(1.06)}.photo-mark{position:absolute;z-index:1;right:12px;top:11px;padding:6px 9px;border:1px solid #ffffff3b;border-radius:20px;background:#0b0d0d91;backdrop-filter:blur(8px);font:8px 'DM Mono',monospace;letter-spacing:.13em;color:#eff2eb}
    .status{display:flex;justify-content:center;align-items:center;gap:8px;margin:9px 0 0;font:9px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#9ba59d}.status i{width:5px;height:5px;border-radius:50%;background:#768078}.state-running .status{color:var(--lime)}.state-running .status i{background:var(--lime);box-shadow:0 0 9px var(--lime)}
    .start-wrap{display:flex;justify-content:center;margin:11px 0 12px}.start{position:relative;width:76px;height:76px;border:1px solid #526144;border-radius:50%;background:radial-gradient(circle at 42% 30%,#38452e,#1a2117 70%);color:var(--lime);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 5px #a5ce4a0a,0 0 0 1px #b9e7781c,inset 0 1px 0 #ffffff1c,0 10px 23px #0008;transition:transform .16s,box-shadow .2s,background .2s;touch-action:manipulation}.start:before{content:"";position:absolute;inset:5px;border:1px solid #d1fb7130;border-radius:50%}.start:active{transform:scale(.96)}.start.running{background:radial-gradient(circle at 42% 30%,#e0ff9a,#9dbd5f 68%,#465a2e);color:#172012;box-shadow:0 0 26px #c8f57543,0 0 0 5px #a5ce4a0a,inset 0 1px 0 #fff9}.start svg{width:21px;height:21px}.start small{position:absolute;bottom:15px;font:7px 'DM Mono',monospace;letter-spacing:.12em}.start .power{position:absolute;top:14px}
    .rule{height:1px;flex:none;background:linear-gradient(90deg,transparent,#ffffff19,transparent);margin:0 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.section-head h2{margin:0;font-size:10px;font-weight:800;letter-spacing:.09em}.hint{font:8px 'DM Mono',monospace;color:#a0aaa2;letter-spacing:.05em;text-align:right}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .control{--hold:0;position:relative;height:91px;display:flex;align-items:flex-start;gap:11px;padding:13px 12px;border:1px solid #ffffff16;border-radius:16px;background:linear-gradient(145deg,#1b2021,#121618 74%);color:var(--white);text-align:left;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0a,0 7px 16px #0002;transition:border-color .2s,background .2s,transform .16s,box-shadow .2s}.control:active{transform:scale(.985)}.control:focus-visible,.start:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.control.holding{border-color:#bbd67b;box-shadow:inset 0 1px 0 #ffffff12,0 0 0 3px #d7fb7911,0 8px 18px #0003}.control.active{border-color:#72874e;background:linear-gradient(145deg,#242c1e,#151914)}.control.alarm{border-color:#bd6a59;background:linear-gradient(145deg,#311e1c,#171414);box-shadow:inset 0 1px 0 #ffffff12,0 0 18px #ff766b21}.control.trunk{border-color:#6897b2;background:linear-gradient(145deg,#1d2a32,#14191d);box-shadow:inset 0 1px 0 #ffffff12,0 0 18px #7bc7ff21}
    .icon-box{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid #ffffff12;border-radius:11px;background:linear-gradient(150deg,#ffffff11,#ffffff03);color:#c8d0c9}.control.active .icon-box{color:var(--lime);border-color:#d7fb792a;background:#d7fb7910}.control.alarm .icon-box{color:var(--red);border-color:#ff82772b;background:#ff827711}.control.trunk .icon-box{color:var(--blue);border-color:#8acbff2b;background:#8acbff10}.icon-box svg{width:17px;height:17px}
    .copy{min-width:0;padding-top:1px}.label{display:block;font-size:11px;line-height:1.25;font-weight:800;letter-spacing:-.02em}.sub{display:block;margin-top:6px;font:7px 'DM Mono',monospace;color:#89938d;letter-spacing:.07em;white-space:nowrap}.control.active .sub{color:#c1df86}.control.alarm .sub{color:#ffa195}.control.trunk .sub{color:#a9d9f5}.hold-cue{position:absolute;right:11px;top:12px;color:#929b95;font:10px 'DM Mono',monospace;transition:color .2s,transform .2s}.control.holding .hold-cue{color:var(--lime);transform:scale(1.16)}.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:#ffffff08}.progress span{display:block;width:100%;height:100%;background:linear-gradient(90deg,#a9ce65,var(--lime));transform:scaleX(var(--hold));transform-origin:left center}.control.alarm .progress span{background:var(--red)}.control.trunk .progress span{background:var(--blue)}
    .toast{position:fixed;z-index:5;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,10px);padding:10px 15px;border:1px solid #ffffff1c;border-radius:30px;background:#202722ed;backdrop-filter:blur(12px);color:#f1f3ef;font-size:10px;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 24px #0007}.toast.show{opacity:1;transform:translate(-50%,0)}.foot{margin-top:auto;padding-top:12px;text-align:center;color:#68726c;font:7px 'DM Mono',monospace;letter-spacing:.035em}.foot a{color:#8b958f;text-decoration:none}.foot a:hover{text-decoration:underline}
    @media(max-height:700px){.app{padding-top:10px;padding-bottom:9px}.heading{margin-top:8px}.heading h1{font-size:27px}.vehicle{font-size:9px}.scene{height:clamp(112px,22svh,145px);margin-top:9px}.status{margin-top:7px}.start-wrap{margin:8px 0 9px}.start{width:68px;height:68px}.start .power{top:11px}.start small{bottom:13px}.rule{margin-bottom:9px}.section-head{margin-bottom:7px}.control{height:82px;padding:11px 10px;gap:9px}.icon-box{width:30px;height:30px}.foot{padding-top:8px}}
    @media(max-width:360px){body{padding-left:13px;padding-right:13px}.controls{gap:8px}.control{padding-left:9px;padding-right:9px;gap:8px}.label{font-size:10px}.sub{font-size:6px}.hint{font-size:7px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="top"><div class="brand">GARAGE<span>/</span>01</div><div class="connection"><i class="dot"></i><span>DEMO REJIMI</span></div></header>
    <section class="heading"><div><div class="eyebrow">AVTOMOBIL BOSHQARUVI</div><h1>COBALT</h1></div><div class="vehicle">Chevrolet · masofaviy boshqaruv</div></section>
    <section class="scene" aria-label="Chevrolet Cobalt rasmi"><img src="cobalt.jpg" alt="Siz yuborgan Chevrolet Cobalt rasmi" fetchpriority="high"><span class="photo-mark">CHEVROLET · COBALT</span></section>
    <div class="status" id="status"><i></i><span>O‘CHIRILGAN</span></div>
    <div class="start-wrap"><button class="start" id="ignition" aria-label="O‘t oldirish"><svg class="power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v10"/><path d="M5.6 5.6a9 9 0 1 0 12.8 0"/></svg><small id="ignitionLabel">START</small></button></div>
    <div class="rule"></div>
    <div class="section-head"><h2>QULF VA XAVFSIZLIK</h2><span class="hint">MAXSUS AMAL UCHUN BOSIB USHLANG</span></div>
    <section class="controls" aria-label="Qulf va xavfsizlik boshqaruvlari">
      <button class="control" id="lock" type="button" aria-label="Qulflash; signalizatsiya uchun bosib ushlab turing">
        <span class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span class="copy"><span class="label">Qulflash</span><span class="sub">BOSIB USHLANG</span></span><span class="hold-cue">●</span><span class="progress"><span></span></span>
      </button>
      <button class="control" id="unlock" type="button" aria-label="Ochish; bagaj uchun bosib ushlab turing">
        <span class="icon-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg></span><span class="copy"><span class="label">Ochish</span><span class="sub">BOSIB USHLANG</span></span><span class="hold-cue">●</span><span class="progress"><span></span></span>
      </button>
    </section>
    <footer class="foot">CHEVROLET COBALT - BOSHQARUV PANELI</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const $=s=>document.querySelector(s),app=$('#app'),toast=$('#toast');
    let locked=false,running=false,alarmOn=false,toastTimer;
    const HOLD_MS=720,MOVE_LIMIT=18;
    function notice(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}
    $('#ignition').addEventListener('click',()=>{running=!running;app.classList.toggle('state-running',running);$('#ignition').classList.toggle('running',running);$('#status span').textContent=running?'O‘T OLDIRILGAN':'O‘CHIRILGAN';$('#ignitionLabel').textContent=running?'STOP':'START';notice(running?'O‘t oldirish yoqildi':'Avtomobil o‘chirildi')});
    const lock=$('#lock'),unlock=$('#unlock');
    function renderLock(){lock.classList.toggle('active',locked);lock.classList.toggle('alarm',alarmOn);lock.querySelector('.sub').textContent=alarmOn?'OXRANA YOQILDI':locked?'QULFLANGAN':'BOSIB USHLANG'}
    function setLock(next){locked=next;alarmOn=false;renderLock();notice(locked?'Avtomobil qulflandi':'Avtomobil ochildi')}
    function shortAction(kind){if(kind==='lock')setLock(!locked);else setLock(false)}
    function specialAction(el,kind){if(kind==='alarm'){locked=true;alarmOn=true;renderLock();notice('Oxrana yoqildi')}else{el.classList.add('trunk');el.querySelector('.sub').textContent='BAGAJ OCHILDI';notice('Bagaj ochildi');setTimeout(()=>{el.classList.remove('trunk');el.querySelector('.sub').textContent='BOSIB USHLANG'},1900)}}
    function bindPress(el,kind){let pointer=null,startX=0,startY=0,startedAt=0,timer=0,triggered=false,moved=false,frame=0;const bar=el.querySelector('.progress span');
      function resetProgress(){el.style.setProperty('--hold',0)}
      function animate(){if(pointer===null)return;const progress=Math.min(1,(performance.now()-startedAt)/HOLD_MS);el.style.setProperty('--hold',progress);if(progress<1&&!triggered)frame=requestAnimationFrame(animate)}
      function end(e){if(pointer!==e.pointerId)return;clearTimeout(timer);cancelAnimationFrame(frame);const wasTriggered=triggered;pointer=null;el.classList.remove('holding');resetProgress();if(!moved&&!wasTriggered)shortAction(kind)}
      el.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;pointer=e.pointerId;startX=e.clientX;startY=e.clientY;startedAt=performance.now();triggered=false;moved=false;el.classList.add('holding');el.setPointerCapture(pointer);timer=setTimeout(()=>{if(pointer!==null&&!moved&&!triggered){triggered=true;el.classList.remove('holding');specialAction(el,kind)}},HOLD_MS);frame=requestAnimationFrame(animate)});
      el.addEventListener('pointermove',e=>{if(pointer!==e.pointerId)return;if(Math.hypot(e.clientX-startX,e.clientY-startY)>MOVE_LIMIT){moved=true;clearTimeout(timer);cancelAnimationFrame(frame);el.classList.remove('holding');resetProgress()}});
      el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
      el.addEventListener('click',e=>{if(e.detail===0)shortAction(kind)});
    }
    bindPress(lock,'alarm');bindPress(unlock,'trunk');
  </script>
</body>
</html>
